name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Format, Typecheck, Build, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync AppKit docs
        run: node scripts/sync-appkit-docs.mjs

      - name: Format check
        run: pnpm exec prettier -c .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run critical user flows
        run: pnpm exec playwright test --config playwright.critical.config.ts

      - name: Run tests
        run: pnpm test

      - name: Upload critical Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-${{ github.run_attempt }}
          path: |
            test-results/critical
            playwright-report/critical
          if-no-files-found: ignore
          retention-days: 7
